; first-lab.kr 전용 PHP 풀 (/etc/php/8.1/fpm/pool.d/ 에 설치됨)
; 블로그가 해킹당해도 사주데이 파일/명령에 접근하지 못하도록 격리

[first-lab]
user  = firstlab
group = firstlab

listen = /run/php/php8.1-fpm-first-lab.sock
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

; 메모리 절약: 요청 있을 때만 실행, 최대 3개
pm = ondemand
pm.max_children = 3
pm.process_idle_timeout = 10s
pm.max_requests = 500

; 격리: 블로그 폴더 밖 파일 접근 금지, 쉘 명령 실행 금지
php_admin_value[open_basedir]      = /var/www/first-lab:/var/lib/first-lab/tmp
php_admin_value[upload_tmp_dir]    = /var/lib/first-lab/tmp
php_admin_value[sys_temp_dir]      = /var/lib/first-lab/tmp
php_admin_value[session.save_path] = /var/lib/first-lab/tmp
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec

php_admin_value[memory_limit]        = 128M
php_admin_value[upload_max_filesize] = 32M
php_admin_value[post_max_size]       = 32M
