# first-lab.kr 워드프레스 (/etc/nginx/sites-available/first-lab 에 설치됨)

# http → https, www → 기본 도메인
server {
    listen 80;
    server_name first-lab.kr www.first-lab.kr;

    # Let's Encrypt 인증서 갱신용
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/first-lab;
    }
    location / {
        return 301 https://first-lab.kr$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.first-lab.kr;
    include /etc/nginx/snippets/first-lab-ssl.conf;
    return 301 https://first-lab.kr$request_uri;
}

server {
    listen 443 ssl;
    server_name first-lab.kr;
    include /etc/nginx/snippets/first-lab-ssl.conf;

    root /var/www/first-lab;
    index index.php;
    client_max_body_size 32M;
    server_tokens off;                          # nginx 버전 숨김 (이 사이트에만 적용)
    include /etc/nginx/snippets/first-lab-headers.conf;

    # ---- 캐시 제외 조건 (로그인 사용자, 관리자, POST, 검색 등) ----
    set $skip_cache 0;
    if ($request_method = POST)  { set $skip_cache 1; }
    if ($query_string != "")     { set $skip_cache 1; }
    if ($request_uri ~* "/wp-admin/|/wp-json/|/xmlrpc\.php|/wp-[a-z-]+\.php|/feed/|sitemap.*\.xml") {
        set $skip_cache 1;
    }
    if ($http_cookie ~* "comment_author|wordpress_[a-f0-9]+|wp-postpass|wordpress_no_cache|wordpress_logged_in") {
        set $skip_cache 1;
    }
    # 광고를 안 띄우는 방문(운영자 기기 쿠키·우리 봇)은 캐시를 쓰지도 남기지도 않음 — 광고 없는 화면이 남에게 나가지 않게 (first-lab-adsense.php)
    if ($http_cookie ~* "firstlab_noads=1") {
        set $skip_cache 1;
    }
    if ($http_user_agent ~* "FirstLab") {
        set $skip_cache 1;
    }

    # ---- 차단 규칙 (정규식은 위에서부터 검사되므로 PHP 처리보다 먼저 둠) ----
    location ^~ /wp-content/database/ { deny all; }      # SQLite DB
    location ~* /wp-content/uploads/.*\.php$ { deny all; } # 업로드 폴더 PHP 실행 금지
    location ~ /\. { deny all; }                          # .htaccess, .ht.sqlite 등 숨김 파일
    location ~* ^/(readme\.html|license\.txt|wp-config-sample\.php)$ { deny all; }  # 워드프레스 버전 노출 방지
    # 11/11 운영자 'PHP 취약점 노리고 해킹 들어온다는데': 안 쓰는 공격 통로 닫기
    location = /xmlrpc.php { return 403; }                 # XML-RPC — 우리는 안 씀(봇은 REST+토큰), 한 요청에 비밀번호 수백 개 대입(system.multicall)이 됨
    location ^~ /author/ { return 404; }                   # 작성자 페이지 — 로그인 아이디 짐작에 쓰임, 사이트에 링크 없음
    if ($arg_author) { return 404; }                       # ?author=1 → 작성자 주소로 넘어가며 아이디가 드러남

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # 로그인: 횟수 제한 + 캐시 안 함 (XML-RPC 는 위에서 막음)
    location = /wp-login.php {
        limit_req zone=firstlab_login burst=5 nodelay;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.1-fpm-first-lab.sock;
    }

    location ~ \.php$ {
        limit_req zone=firstlab_pages burst=60 nodelay;   # 새로고침·봇 폭주 (first-lab-http.conf)
        limit_req_status 429;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.1-fpm-first-lab.sock;

        fastcgi_cache firstlab_cache;
        fastcgi_cache_key "$scheme$request_method$host$request_uri";
        fastcgi_cache_valid 200 301 10m;   # 새 글은 최대 10분 뒤 방문자에게 보임
        fastcgi_cache_bypass $skip_cache;
        fastcgi_no_cache $skip_cache;
        fastcgi_cache_use_stale error timeout updating http_500 http_503;
        fastcgi_cache_background_update on;
        fastcgi_cache_lock on;
        add_header X-Cache $upstream_cache_status;
        include /etc/nginx/snippets/first-lab-headers.conf;
    }

    # 정적 파일 브라우저 캐시
    location ~* \.(css|js|jpg|jpeg|png|gif|webp|svg|ico|woff2?)$ {
        expires 30d;
        include /etc/nginx/snippets/first-lab-headers.conf;
        access_log off;
    }
}
