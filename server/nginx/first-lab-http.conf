# http 블록에 들어가는 전역 설정 (/etc/nginx/conf.d/ 에 설치됨)
# 이름에 first-lab 을 붙여 사주데이 설정과 충돌하지 않게 함

# 페이지 캐시: 디스크 최대 512MB, 7일간 안 쓰인 캐시는 삭제
fastcgi_cache_path /var/cache/nginx/first-lab levels=1:2 keys_zone=firstlab_cache:10m
                   max_size=512m inactive=7d use_temp_path=off;

# 로그인 무차별 대입 방지: IP당 분당 10회
limit_req_zone $binary_remote_addr zone=firstlab_login:10m rate=10r/m;
