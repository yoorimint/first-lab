# http 블록에 들어가는 전역 설정 (/etc/nginx/conf.d/ 에 설치됨)
# 이름에 first-lab 을 붙여 사주데이 설정과 충돌하지 않게 함

# 페이지 캐시: 디스크 최대 512MB, 7일간 안 쓰인 캐시는 삭제
fastcgi_cache_path /var/cache/nginx/first-lab levels=1:2 keys_zone=firstlab_cache:10m
                   max_size=512m inactive=7d use_temp_path=off;

# 로그인 무차별 대입 방지: IP당 분당 10회
limit_req_zone $binary_remote_addr zone=firstlab_login:10m rate=10r/m;

# 페이지 새로고침·봇 폭주 방지 (11/11 운영자 '악의적으로 계속 클릭하거나 새로고침하거나 봇이 막 들어오거나'):
# IP당 분당 120회(순간 60회 더) 넘으면 429. 사람은 이만큼 못 넘김 (통신사 공유 IP도 감안해 넉넉히).
# 구글·네이버 등 검색·광고 크롤러는 빼서 색인이 늦어지지 않게 (이름을 사칭하면 fail2ban·로그로 봄).
map $http_user_agent $firstlab_rate_key {
    default $binary_remote_addr;
    ~*(Googlebot|Mediapartners-Google|AdsBot-Google|Google-InspectionTool|bingbot|Yeti) "";
}
limit_req_zone $firstlab_rate_key zone=firstlab_pages:10m rate=120r/m;
