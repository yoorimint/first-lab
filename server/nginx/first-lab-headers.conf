# 보안 헤더 (/etc/nginx/snippets/ 에 설치됨)
# nginx 는 location 안에 add_header 가 있으면 바깥 것을 물려받지 않으므로, 필요한 곳마다 include 한다.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;  # 항상 HTTPS
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;            # 다른 사이트가 우리 페이지를 몰래 끼워넣기 방지
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
