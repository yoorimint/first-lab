# main 브랜치에 변경이 push 되면: 1) 자동 검사 → 2) 통과했을 때만 서버에 적용
name: Deploy server config

on:
  push:
    branches: [main]
    # 경로 제한 없음: main 의 모든 커밋을 배포 (11/10: 문서만 바꾼 커밋은 배포가 안 돌아 서버 버전이 main 과 계속 달라짐 →
    #   15분 따라잡기 예약은 GitHub 이 몇 시간씩 미루기도 해 '배포 막힘' 알림이 7시간 남음. 서버도 automation/ 을 읽음)
  workflow_dispatch: # GitHub 화면에서 수동 실행도 가능
  schedule:
    # 따라잡기: GitHub 오류로 push 배포가 시작되지 않는 일이 있었음 (11/4) → 15분마다 서버 버전이 main 과 다르면 배포
    - cron: "*/15 * * * *"

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  gate:
    # 예약 실행일 때만: 서버에 반영된 버전(배포 끝에 기록)이 main 과 같으면 건너뜀
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 배포할 버전(sha): push 는 그 커밋, 예약·수동은 main 의 최신 커밋.
    #   예약 실행은 기본 브랜치(main 아님)에서 돌아 github.sha 가 main 보다 뒤처질 수 있음 → 그대로 쓰면 서버가 옛 버전으로 되돌아감 (11/5 발견)
    outputs:
      need: ${{ steps.cmp.outputs.need }}
      sha: ${{ steps.cmp.outputs.sha }}
    steps:
      - id: cmp
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"; echo "need=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # 작업 토큰으로 읽음 (11/6 비공개였을 때 인증 없는 읽기가 실패 — 11/6 공개 전환 뒤에도 그대로 둠, 다시 비공개가 돼도 안 깨지게)
          main=$(curl -fsS --max-time 20 -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/commits/main" | python3 -c "import json,sys; print(json.load(sys.stdin)['sha'])" || true)
          [ -n "$main" ] || { echo "main 버전을 못 읽음"; exit 1; }
          echo "sha=$main" >> "$GITHUB_OUTPUT"
          deployed=$(curl -fsS --max-time 20 https://first-lab.kr/deployed-version.txt || echo none)
          echo "서버 버전: $deployed / main: $main"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$deployed" = "$main" ]; then echo "need=false" >> "$GITHUB_OUTPUT"; else echo "need=true" >> "$GITHUB_OUTPUT"; fi

  check:
    # 서버에 올리기 전 검사: 하나라도 실패하면 배포하지 않는다 (운영 중인 봇이 멈추는 것 방지)
    needs: gate
    if: needs.gate.outputs.need == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}   # 서버에 올릴 바로 그 버전을 검사
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"   # 서버(Ubuntu 22.04)와 같은 버전
      - name: Install bot dependencies
        run: pip install -q -r bot/requirements.txt
      - name: Python syntax
        run: python -m compileall -q bot tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Calculators
        run: node tests/test_calculators.mjs   # 계산기 검증 사례가 하나라도 틀리면 배포 안 함
      - name: Shell syntax
        run: for f in server/*.sh; do bash -n "$f"; done
      - name: PHP syntax
        run: for f in wordpress/mu-plugins/*.php; do php -l "$f"; done
      - name: JSON files
        run: python -c "import json; json.load(open('wordpress/patches.json', encoding='utf-8'))"

  deploy:
    needs: [gate, check]
    runs-on: ubuntu-latest
    timeout-minutes: 70   # 11/8 다시 시도 단계까지 (30m 두 번 + 여유). 11/6: 서버 적용이 끝났는데 GitHub 쪽에서 작업이 '진행 중'으로 멈춰 다음 배포가 모두 대기 — 기본 6시간 대신 끊음 (command_timeout 30m + 여유)
    steps:
      - name: Apply on server
        id: apply
        continue-on-error: true   # 11/8 두 번: 배포 도구(drone-ssh) 내려받기가 GitHub 504 로 실패 → 1분 뒤 한 번 더 (아래 두 단계는 내용이 같아야 함 — tests DeployRetryTest)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          command_timeout: 30m   # 기본 10분 — 글·수정이 늘며 넘겨서 11/5 오후 배포가 계속 실패함 (보정·사진 정리는 한 번에 읽기로 줄임)
          script: |
            set -e
            REPO=/opt/first-lab
            PREV=$(cat /var/www/first-lab/deployed-version.txt 2>/dev/null || echo none)   # 지난번에 서버에 올린 버전
            if [ -d "$REPO/.git" ]; then
              git -C "$REPO" fetch -q origin main
              git -C "$REPO" reset -q --hard ${{ needs.gate.outputs.sha }}   # 검사를 통과한 바로 그 버전
            else
              git clone -q https://github.com/yoorimint/first-lab "$REPO"
            fi
            # 빠른 배포 (11/9 운영자 '이렇게 비효율적으로 해야 돼?'): 글·화면·봇 코드만 바뀌면 바뀐 것만 반영 (1~2분).
            # 서버 설정·워크플로·페이지·패키지가 바뀌었거나, 지난 버전을 모르거나, 그날 첫 배포면 전체 배포 (tests DeploySpeedTest)
            CHANGED=$(git -C "$REPO" diff --name-only "$PREV" HEAD 2>/dev/null || echo FULL)
            FULL_MARK=/var/lib/first-lab/bot/full-deploy-date
            # 같은 서버의 사주데이 앱보다 낮은 몫으로 (11/6 10:06 배포 때 부하 5.14·사주데이 /healthz 응답 없음 1분)
            # cgroup v2 에선 Nice 는 서비스 사이에 안 먹음 → CPUWeight·IOWeight(기본 100)를 낮춘 범위에서 실행
            LOW="nice -n 10"
            if command -v systemd-run >/dev/null; then LOW="systemd-run --scope --quiet -p CPUWeight=20 -p IOWeight=20 nice -n 10"; fi
            if printf '%s\n' "$CHANGED" | grep -qE '^(FULL|server/|\.github/|bot/requirements\.txt|wordpress/pages/)' || [ "$(cat "$FULL_MARK" 2>/dev/null)" != "$(date +%F)" ]; then
              echo "전체 배포"
              $LOW bash "$REPO/server/setup.sh"
              $LOW bash "$REPO/server/wp-setup.sh"
              $LOW bash "$REPO/server/bot-setup.sh"
              $LOW bash "$REPO/server/bot-check.sh"
              date +%F > "$FULL_MARK"
            else
              echo "빠른 배포"
              $LOW bash "$REPO/server/quick-deploy.sh" "$CHANGED"
            fi
            echo "${{ needs.gate.outputs.sha }}" > /var/www/first-lab/deployed-version.txt   # 따라잡기(gate)가 비교하는 값
      - name: Wait before retry
        if: steps.apply.outcome == 'failure'
        run: sleep 60
      - name: Apply on server (retry)
        if: steps.apply.outcome == 'failure'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          command_timeout: 30m   # 기본 10분 — 글·수정이 늘며 넘겨서 11/5 오후 배포가 계속 실패함 (보정·사진 정리는 한 번에 읽기로 줄임)
          script: |
            set -e
            REPO=/opt/first-lab
            PREV=$(cat /var/www/first-lab/deployed-version.txt 2>/dev/null || echo none)   # 지난번에 서버에 올린 버전
            if [ -d "$REPO/.git" ]; then
              git -C "$REPO" fetch -q origin main
              git -C "$REPO" reset -q --hard ${{ needs.gate.outputs.sha }}   # 검사를 통과한 바로 그 버전
            else
              git clone -q https://github.com/yoorimint/first-lab "$REPO"
            fi
            # 빠른 배포 (11/9 운영자 '이렇게 비효율적으로 해야 돼?'): 글·화면·봇 코드만 바뀌면 바뀐 것만 반영 (1~2분).
            # 서버 설정·워크플로·페이지·패키지가 바뀌었거나, 지난 버전을 모르거나, 그날 첫 배포면 전체 배포 (tests DeploySpeedTest)
            CHANGED=$(git -C "$REPO" diff --name-only "$PREV" HEAD 2>/dev/null || echo FULL)
            FULL_MARK=/var/lib/first-lab/bot/full-deploy-date
            # 같은 서버의 사주데이 앱보다 낮은 몫으로 (11/6 10:06 배포 때 부하 5.14·사주데이 /healthz 응답 없음 1분)
            # cgroup v2 에선 Nice 는 서비스 사이에 안 먹음 → CPUWeight·IOWeight(기본 100)를 낮춘 범위에서 실행
            LOW="nice -n 10"
            if command -v systemd-run >/dev/null; then LOW="systemd-run --scope --quiet -p CPUWeight=20 -p IOWeight=20 nice -n 10"; fi
            if printf '%s\n' "$CHANGED" | grep -qE '^(FULL|server/|\.github/|bot/requirements\.txt|wordpress/pages/)' || [ "$(cat "$FULL_MARK" 2>/dev/null)" != "$(date +%F)" ]; then
              echo "전체 배포"
              $LOW bash "$REPO/server/setup.sh"
              $LOW bash "$REPO/server/wp-setup.sh"
              $LOW bash "$REPO/server/bot-setup.sh"
              $LOW bash "$REPO/server/bot-check.sh"
              date +%F > "$FULL_MARK"
            else
              echo "빠른 배포"
              $LOW bash "$REPO/server/quick-deploy.sh" "$CHANGED"
            fi
            echo "${{ needs.gate.outputs.sha }}" > /var/www/first-lab/deployed-version.txt   # 따라잡기(gate)가 비교하는 값
