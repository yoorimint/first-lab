# main 브랜치에 변경이 push 되면: 1) 자동 검사 → 2) 통과했을 때만 서버에 적용
name: Deploy server config

on:
  push:
    branches: [main]
    # 경로 제한 없음: main 의 모든 커밋을 배포 (11/10: 문서만 바꾼 커밋은 배포가 안 돌아 서버 버전이 main 과 계속 달라짐 →
    #   15분 따라잡기 예약은 GitHub 이 몇 시간씩 미루기도 해 '배포 막힘' 알림이 7시간 남음. 서버도 automation/ 을 읽음)
  workflow_dispatch: # GitHub 화면에서 수동 실행도 가능
  schedule:
    # 따라잡기: GitHub 오류로 push 배포가 시작되지 않는 일이 있었음 (11/4) → 15분마다 서버 버전이 main 과 다르면 배포
    - cron: "*/15 * * * *"

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # ── API 봇 저장소 반영 (운영자 11/12 '그냥 api로 할 때 지금하고 똑같은 작업을') ──
  # 글 작성 방식이 API 봇이면 서버 안 글쓰기가 저장소 수정(검수 패치·계산기·연초 값·검사 코드)을 묶음으로 남긴다 (bot/api_writer.py OUTBOX).
  # 예약·수동 실행 때 그 묶음을 가져와 → 최신 main 위에서 같은 검사 → 통과하면 이 작업 토큰으로 main 에 → 아래 gate 가 같은 실행에서 바로 배포.
  # 비밀값(SSH)을 가진 작업은 묶음 코드를 돌리지 않고, 묶음 코드를 돌리는 검사 작업은 비밀값·쓰기 권한이 없다 (automation/api_sync.py).
  sync_fetch:
    # push 때도 돈다 (11/12: 예약 실행은 GitHub 이 몇 시간씩 미뤄 묶음이 쌓임 — 03:14Z 뒤 예약 실행 없음 확인)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      has: ${{ steps.fetch.outputs.has }}
      head: ${{ steps.fetch.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -q paramiko
      - id: fetch
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: python automation/api_sync.py fetch --out "$RUNNER_TEMP/outbox"
      - if: steps.fetch.outputs.has == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: api-outbox
          path: ${{ runner.temp }}/outbox/outbox.bundle
          retention-days: 1

  sync_check:
    needs: sync_fetch
    if: needs.sync_fetch.outputs.has == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      status: ${{ steps.check.outputs.status }}
      why: ${{ steps.check.outputs.why }}
      sha: ${{ steps.check.outputs.sha }}
      base: ${{ steps.check.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"   # 서버(Ubuntu 22.04)와 같은 버전
      - run: pip install -q -r bot/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: api-outbox
          path: ${{ runner.temp }}/in
      - id: check
        run: python automation/api_sync.py check --bundle "$RUNNER_TEMP/in/outbox.bundle" --work "$RUNNER_TEMP/work" --out "$RUNNER_TEMP/tested"
      - if: steps.check.outputs.status == 'ok'
        uses: actions/upload-artifact@v4
        with:
          name: api-tested
          path: ${{ runner.temp }}/tested/tested.bundle
          retention-days: 1

  sync_push:
    needs: sync_check
    if: needs.sync_check.outputs.status == 'ok'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # main 에 올리는 것은 이 작업 하나 (묶음 코드는 돌리지 않음 — 검사한 커밋을 fast-forward 만)
    outputs:
      status: ${{ steps.push.outputs.status }}
      why: ${{ steps.push.outputs.why }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/download-artifact@v4
        with:
          name: api-tested
          path: ${{ runner.temp }}/tested
      - id: push
        env:
          SHA: ${{ needs.sync_check.outputs.sha }}
          BASE: ${{ needs.sync_check.outputs.base }}
        run: python automation/api_sync.py push --bundle "$RUNNER_TEMP/tested/tested.bundle" --sha "$SHA" --base "$BASE"

  sync_report:
    needs: [sync_fetch, sync_check, sync_push]
    if: ${{ !cancelled() && needs.sync_fetch.outputs.has == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -q paramiko
      - env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          HEAD_SHA: ${{ needs.sync_fetch.outputs.head }}
          CHECK_RESULT: ${{ needs.sync_check.result }}
          CHECK_STATUS: ${{ needs.sync_check.outputs.status }}
          CHECK_WHY: ${{ needs.sync_check.outputs.why }}
          PUSH_RESULT: ${{ needs.sync_push.result }}
          PUSH_STATUS: ${{ needs.sync_push.outputs.status }}
          PUSH_WHY: ${{ needs.sync_push.outputs.why }}
          PUSHED_SHA: ${{ needs.sync_check.outputs.sha }}
        run: python automation/api_sync.py report

  gate:
    # 예약 실행일 때만: 서버에 반영된 버전(배포 끝에 기록)이 main 과 같으면 건너뜀
    # API 봇 묶음을 올렸으면(sync_push) 그 main 을 같은 실행에서 배포 — 반영 작업이 건너뛰거나 실패해도 배포는 그대로
    needs: sync_push
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 배포할 버전(sha): push 는 그 커밋, 예약·수동은 main 의 최신 커밋.
    #   예약 실행은 기본 브랜치(main 아님)에서 돌아 github.sha 가 main 보다 뒤처질 수 있음 → 그대로 쓰면 서버가 옛 버전으로 되돌아감 (11/5 발견)
    outputs:
      need: ${{ steps.cmp.outputs.need }}
      sha: ${{ steps.cmp.outputs.sha }}
    steps:
      - id: cmp
        run: |
          # push 실행인데 API 봇 묶음을 main 에 올렸으면(pushed) 그 최신 main 을 배포 — 아니면 push 한 커밋
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ needs.sync_push.outputs.status }}" != "pushed" ]; then
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"; echo "need=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # 작업 토큰으로 읽음 (11/6 비공개였을 때 인증 없는 읽기가 실패 — 11/6 공개 전환 뒤에도 그대로 둠, 다시 비공개가 돼도 안 깨지게)
          main=$(curl -fsS --max-time 20 -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/commits/main" | python3 -c "import json,sys; print(json.load(sys.stdin)['sha'])" || true)
          [ -n "$main" ] || { echo "main 버전을 못 읽음"; exit 1; }
          echo "sha=$main" >> "$GITHUB_OUTPUT"
          deployed=$(curl -fsS --max-time 20 https://first-lab.kr/deployed-version.txt || echo none)
          echo "서버 버전: $deployed / main: $main"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$deployed" = "$main" ]; then echo "need=false" >> "$GITHUB_OUTPUT"; else echo "need=true" >> "$GITHUB_OUTPUT"; fi

  check:
    # 서버에 올리기 전 검사: 하나라도 실패하면 배포하지 않는다 (운영 중인 봇이 멈추는 것 방지)
    needs: gate
    # 앞 반영 작업이 건너뛰어져도 이어서 건너뛰지 않게 상태를 직접 봄
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.gate.outputs.need == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}   # 서버에 올릴 바로 그 버전을 검사
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"   # 서버(Ubuntu 22.04)와 같은 버전
      - name: Install bot dependencies
        run: pip install -q -r bot/requirements.txt
      - name: Python syntax
        run: python -m compileall -q bot tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Calculators
        run: node tests/test_calculators.mjs   # 계산기 검증 사례가 하나라도 틀리면 배포 안 함
      - name: Shell syntax
        run: for f in server/*.sh; do bash -n "$f"; done
      - name: PHP syntax
        run: for f in wordpress/mu-plugins/*.php; do php -l "$f"; done
      - name: JSON files
        run: python -c "import json; json.load(open('wordpress/patches.json', encoding='utf-8'))"

  deploy:
    needs: [gate, check]
    if: ${{ !cancelled() && needs.check.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 70   # 11/8 다시 시도 단계까지 (30m 두 번 + 여유). 11/6: 서버 적용이 끝났는데 GitHub 쪽에서 작업이 '진행 중'으로 멈춰 다음 배포가 모두 대기 — 기본 6시간 대신 끊음 (command_timeout 30m + 여유)
    steps:
      - name: Apply on server
        id: apply
        continue-on-error: true   # 11/8 두 번: 배포 도구(drone-ssh) 내려받기가 GitHub 504 로 실패 → 1분 뒤 한 번 더 (아래 두 단계는 내용이 같아야 함 — tests DeployRetryTest)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          command_timeout: 30m   # 기본 10분 — 글·수정이 늘며 넘겨서 11/5 오후 배포가 계속 실패함 (보정·사진 정리는 한 번에 읽기로 줄임)
          script: |
            set -e
            REPO=/opt/first-lab
            PREV=$(cat /var/www/first-lab/deployed-version.txt 2>/dev/null || echo none)   # 지난번에 서버에 올린 버전
            if [ -d "$REPO/.git" ]; then
              git -C "$REPO" fetch -q origin main
              git -C "$REPO" reset -q --hard ${{ needs.gate.outputs.sha }}   # 검사를 통과한 바로 그 버전
            else
              git clone -q https://github.com/yoorimint/first-lab "$REPO"
            fi
            # 빠른 배포 (11/9 운영자 '이렇게 비효율적으로 해야 돼?'): 글·화면·봇 코드만 바뀌면 바뀐 것만 반영 (1~2분).
            # 서버 설정·워크플로·페이지·패키지가 바뀌었거나, 지난 버전을 모르거나, 그날 첫 배포면 전체 배포 (tests DeploySpeedTest)
            CHANGED=$(git -C "$REPO" diff --name-only "$PREV" HEAD 2>/dev/null || echo FULL)
            FULL_MARK=/var/lib/first-lab/bot/full-deploy-date
            # 같은 서버의 사주데이 앱보다 낮은 몫으로 (11/6 10:06 배포 때 부하 5.14·사주데이 /healthz 응답 없음 1분)
            # cgroup v2 에선 Nice 는 서비스 사이에 안 먹음 → CPUWeight·IOWeight(기본 100)를 낮춘 범위에서 실행
            LOW="nice -n 10"
            if command -v systemd-run >/dev/null; then LOW="systemd-run --scope --quiet -p CPUWeight=20 -p IOWeight=20 nice -n 10"; fi
            if printf '%s\n' "$CHANGED" | grep -qE '^(FULL|server/|\.github/|bot/requirements\.txt|wordpress/pages/)' || [ "$(cat "$FULL_MARK" 2>/dev/null)" != "$(date +%F)" ]; then
              echo "전체 배포"
              $LOW bash "$REPO/server/setup.sh"
              $LOW bash "$REPO/server/wp-setup.sh"
              $LOW bash "$REPO/server/bot-setup.sh"
              $LOW bash "$REPO/server/bot-check.sh"
              date +%F > "$FULL_MARK"
            else
              echo "빠른 배포"
              $LOW bash "$REPO/server/quick-deploy.sh" "$CHANGED"
            fi
            echo "${{ needs.gate.outputs.sha }}" > /var/www/first-lab/deployed-version.txt   # 따라잡기(gate)가 비교하는 값
      - name: Wait before retry
        if: steps.apply.outcome == 'failure'
        run: sleep 60
      - name: Apply on server (retry)
        if: steps.apply.outcome == 'failure'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          command_timeout: 30m   # 기본 10분 — 글·수정이 늘며 넘겨서 11/5 오후 배포가 계속 실패함 (보정·사진 정리는 한 번에 읽기로 줄임)
          script: |
            set -e
            REPO=/opt/first-lab
            PREV=$(cat /var/www/first-lab/deployed-version.txt 2>/dev/null || echo none)   # 지난번에 서버에 올린 버전
            if [ -d "$REPO/.git" ]; then
              git -C "$REPO" fetch -q origin main
              git -C "$REPO" reset -q --hard ${{ needs.gate.outputs.sha }}   # 검사를 통과한 바로 그 버전
            else
              git clone -q https://github.com/yoorimint/first-lab "$REPO"
            fi
            # 빠른 배포 (11/9 운영자 '이렇게 비효율적으로 해야 돼?'): 글·화면·봇 코드만 바뀌면 바뀐 것만 반영 (1~2분).
            # 서버 설정·워크플로·페이지·패키지가 바뀌었거나, 지난 버전을 모르거나, 그날 첫 배포면 전체 배포 (tests DeploySpeedTest)
            CHANGED=$(git -C "$REPO" diff --name-only "$PREV" HEAD 2>/dev/null || echo FULL)
            FULL_MARK=/var/lib/first-lab/bot/full-deploy-date
            # 같은 서버의 사주데이 앱보다 낮은 몫으로 (11/6 10:06 배포 때 부하 5.14·사주데이 /healthz 응답 없음 1분)
            # cgroup v2 에선 Nice 는 서비스 사이에 안 먹음 → CPUWeight·IOWeight(기본 100)를 낮춘 범위에서 실행
            LOW="nice -n 10"
            if command -v systemd-run >/dev/null; then LOW="systemd-run --scope --quiet -p CPUWeight=20 -p IOWeight=20 nice -n 10"; fi
            if printf '%s\n' "$CHANGED" | grep -qE '^(FULL|server/|\.github/|bot/requirements\.txt|wordpress/pages/)' || [ "$(cat "$FULL_MARK" 2>/dev/null)" != "$(date +%F)" ]; then
              echo "전체 배포"
              $LOW bash "$REPO/server/setup.sh"
              $LOW bash "$REPO/server/wp-setup.sh"
              $LOW bash "$REPO/server/bot-setup.sh"
              $LOW bash "$REPO/server/bot-check.sh"
              date +%F > "$FULL_MARK"
            else
              echo "빠른 배포"
              $LOW bash "$REPO/server/quick-deploy.sh" "$CHANGED"
            fi
            echo "${{ needs.gate.outputs.sha }}" > /var/www/first-lab/deployed-version.txt   # 따라잡기(gate)가 비교하는 값
