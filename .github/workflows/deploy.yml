# main 브랜치에 server/ 변경이 push 되면 서버에 자동 적용
name: Deploy server config

on:
  push:
    branches: [main]
    paths: ["server/**", "wordpress/**", "bot/**", ".github/workflows/deploy.yml"]
  workflow_dispatch: # GitHub 화면에서 수동 실행도 가능

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Apply on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            set -e
            REPO=/opt/first-lab
            if [ -d "$REPO/.git" ]; then
              git -C "$REPO" fetch -q origin main
              git -C "$REPO" reset -q --hard origin/main
            else
              git clone -q https://github.com/yoorimint/first-lab "$REPO"
            fi
            bash "$REPO/server/setup.sh"
            bash "$REPO/server/wp-setup.sh"
            bash "$REPO/server/bot-check.sh"
