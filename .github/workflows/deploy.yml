# main 브랜치에 변경이 push 되면: 1) 자동 검사 → 2) 통과했을 때만 서버에 적용
name: Deploy server config

on:
  push:
    branches: [main]
    paths: ["server/**", "wordpress/**", "bot/**", "tests/**", ".github/workflows/deploy.yml"]
  workflow_dispatch: # GitHub 화면에서 수동 실행도 가능
  schedule:
    # 따라잡기: GitHub 오류로 push 배포가 시작되지 않는 일이 있었음 (11/4) → 15분마다 서버 버전이 main 과 다르면 배포
    - cron: "*/15 * * * *"

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  gate:
    # 예약 실행일 때만: 서버에 반영된 버전(배포 끝에 기록)이 main 과 같으면 건너뜀
    runs-on: ubuntu-latest
    outputs:
      need: ${{ steps.cmp.outputs.need }}
    steps:
      - id: cmp
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "need=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          deployed=$(curl -fsS --max-time 20 https://first-lab.kr/deployed-version.txt || echo none)
          echo "서버 버전: $deployed / main: ${{ github.sha }}"
          if [ "$deployed" = "${{ github.sha }}" ]; then echo "need=false" >> "$GITHUB_OUTPUT"; else echo "need=true" >> "$GITHUB_OUTPUT"; fi

  check:
    # 서버에 올리기 전 검사: 하나라도 실패하면 배포하지 않는다 (운영 중인 봇이 멈추는 것 방지)
    needs: gate
    if: needs.gate.outputs.need == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"   # 서버(Ubuntu 22.04)와 같은 버전
      - name: Install bot dependencies
        run: pip install -q -r bot/requirements.txt
      - name: Python syntax
        run: python -m compileall -q bot tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Calculators
        run: node tests/test_calculators.mjs   # 계산기 검증 사례가 하나라도 틀리면 배포 안 함
      - name: Shell syntax
        run: for f in server/*.sh; do bash -n "$f"; done
      - name: PHP syntax
        run: for f in wordpress/mu-plugins/*.php; do php -l "$f"; done
      - name: JSON files
        run: python -c "import json; json.load(open('wordpress/patches.json', encoding='utf-8'))"

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Apply on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          command_timeout: 30m   # 기본 10분 — 글·수정이 늘며 넘겨서 11/5 오후 배포가 계속 실패함 (보정·사진 정리는 한 번에 읽기로 줄임)
          script: |
            set -e
            REPO=/opt/first-lab
            if [ -d "$REPO/.git" ]; then
              git -C "$REPO" fetch -q origin main
              git -C "$REPO" reset -q --hard ${{ github.sha }}   # 검사를 통과한 바로 그 버전
            else
              git clone -q https://github.com/yoorimint/first-lab "$REPO"
            fi
            bash "$REPO/server/setup.sh"
            bash "$REPO/server/wp-setup.sh"
            bash "$REPO/server/bot-setup.sh"
            bash "$REPO/server/bot-check.sh"
            echo "${{ github.sha }}" > /var/www/first-lab/deployed-version.txt   # 따라잡기(gate)가 비교하는 값
